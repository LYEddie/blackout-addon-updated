plugins {
    id "fabric-loom" version "1.10.5"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/blackout.accesswidener")
}

repositories {
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

configurations {
    baritoneBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    modImplementation "meteordevelopment:baritone:${project.minecraft_version}-SNAPSHOT"
    baritoneBundle "meteordevelopment:baritone:${project.minecraft_version}-SNAPSHOT"

    // Loom removes nested-JAR declarations when remapping Baritone for development.
    // Use its bundled Pathfinder on the runtime classpath, including IntelliJ runs.
    runtimeOnly files(provider {
        zipTree(configurations.baritoneBundle.singleFile).matching {
            include "META-INF/jars/nether-pathfinder-*.jar"
        }.singleFile
    })
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}
