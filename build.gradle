plugins {
    id "net.fabricmc.fabric-loom" version "1.18-SNAPSHOT"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base { archivesName = project.archives_base_name }
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/blackout.accesswidener")
}

repositories {
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"
    implementation "meteordevelopment:baritone:${project.baritone_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}
